<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelechukwu John — ỌBA BY KELE &amp; Geophysics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#04050a;--text:#f6f0e4;--muted:#9ea4b3;--gold:#e3b94f;--grgb:227,185,79;--blue:#4f8cff;--brgb:79,140,255;--on-gold:#1a1204;
--line:rgba(255,255,255,.16);--ease:cubic-bezier(.2,.9,.25,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:Sora,sans-serif;margin:0;letter-spacing:-.025em}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#0b1226 0%,var(--bg) 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:48vmax;height:48vmax;background:radial-gradient(circle,rgba(var(--grgb),.55),transparent 68%);top:-16vmax;right:-12vmax}
.bg i:nth-child(2){width:56vmax;height:56vmax;background:radial-gradient(circle,rgba(var(--brgb),.5),transparent 68%);bottom:-22vmax;left:-18vmax;animation-duration:30s;animation-delay:-8s}
.bg i:nth-child(3){width:30vmax;height:30vmax;background:radial-gradient(circle,rgba(var(--brgb),.32),rgba(var(--grgb),.12) 50%,transparent 70%);top:38%;left:42%;animation-duration:36s;animation-delay:-16s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-5vmax,4vmax,0) scale(1.12)}100%{transform:translate3d(4vmax,-3vmax,0) scale(.94)}}
@keyframes rvIn{from{opacity:0;transform:translateY(30px) scale(.97);filter:blur(12px)}}
@keyframes bob{50%{translate:0 -10px}}
@keyframes shine{to{background-position:300% 0}}
@keyframes spin{to{--ang:360deg}}
@keyframes logoIn{from{opacity:0;transform:scale(.88);filter:blur(14px)}}
@keyframes splash{0%,50%{opacity:1}100%{opacity:0;visibility:hidden}}

.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#03040a;pointer-events:none;animation:splash 1.7s var(--ease) .15s forwards}
.splash img{width:clamp(96px,22vw,160px);animation:logoIn 1.3s var(--ease) both}
.splash span{font:700 clamp(30px,8vw,56px) Sora,sans-serif;letter-spacing:.03em;background:linear-gradient(100deg,var(--gold),#fff3c4,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoIn 1.3s var(--ease) both}

/* liquid glass */
.glass{position:relative;isolation:isolate;border:1px solid var(--line);border-radius:28px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.035)),rgba(14,20,36,.3);
 -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.08);backdrop-filter:blur(26px) saturate(190%) brightness(1.08);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 30px rgba(255,255,255,.035),0 28px 60px -22px rgba(0,0,0,.85)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.75;
 background:linear-gradient(140deg,rgba(255,255,255,.6),rgba(255,255,255,0) 32%,rgba(var(--brgb),.4) 64%,rgba(var(--grgb),.55));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;transition:opacity .5s;
 background:radial-gradient(380px circle at var(--mx,28%) var(--my,0%),rgba(255,255,255,.17),transparent 58%)}
.glass:hover::after{opacity:1}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:14px auto 0;max-width:1120px;padding:0 24px}
nav .glass{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 22px;border-radius:999px;transition:padding .5s var(--ease),box-shadow .5s}
nav.scrolled .glass{padding-top:6px;padding-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 18px 44px -14px rgba(0,0,0,.95)}
.brand{display:flex;align-items:center;gap:10px}.logo{height:34px;width:auto;display:block}
nav b{font:700 15px Sora,sans-serif}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px;transition:color .3s,background .3s}
nav a:hover{color:var(--text);background:rgba(255,255,255,.08)}
nav a.cta{background:linear-gradient(135deg,#fbefc0,var(--gold));color:var(--on-gold);font-weight:600}

.btns{display:flex;gap:12px;flex-wrap:wrap}.btns.c{justify-content:center}
.btn{position:relative;overflow:hidden;display:inline-block;padding:14px 26px;border-radius:999px;font-weight:600;color:var(--text);cursor:pointer;border:1px solid var(--line);
 background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.38);transition:transform .5s var(--ease),box-shadow .5s,background .3s}
.btn:hover{transform:translateY(-2px) scale(1.025)}.btn:active{transform:scale(.95);transition-duration:.12s}
.btn.main{color:var(--on-gold);border-color:transparent;background:linear-gradient(135deg,#fbefc0,var(--gold) 50%,#a97c22);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 36px -8px rgba(var(--grgb),.65),0 0 0 1px rgba(var(--grgb),.35)}
.btn.main::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);transition:transform .9s var(--ease)}
.btn.main:hover::after{transform:translateX(130%)}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:72px 0 96px}
.hero h1{font-size:clamp(40px,6.4vw,76px);line-height:1.04;font-weight:700;animation:rvIn 1.1s var(--ease) 1.2s backwards}
.hero h1 span{background:linear-gradient(100deg,var(--gold),#fff3c4,var(--blue),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
.hero p{color:var(--muted);max-width:46ch;font-size:18px;margin:24px 0 32px;animation:rvIn 1.1s var(--ease) 1.35s backwards}
.hero .btns{animation:rvIn 1.1s var(--ease) 1.5s backwards}

.stage{position:relative;height:560px;display:grid;place-items:center}
.phone{width:280px;height:540px;padding:18px;border-radius:44px;z-index:2;animation:rvIn 1.3s var(--ease) 1.4s backwards,bob 8s ease-in-out 2.8s infinite}
.phone .notch{width:84px;height:22px;border-radius:99px;background:rgba(0,0,0,.6);margin:0 auto 22px}
.phone small{color:var(--muted);font-size:12px}
.phone h3{font-size:22px;margin:2px 0 18px}
.ring{width:132px;height:132px;border-radius:50%;margin:6px auto 20px;display:grid;place-items:center;position:relative;
 background:conic-gradient(from var(--ang),var(--gold),#fff3c4,var(--blue),#1d4ed8,var(--gold));animation:spin 7s linear infinite;box-shadow:0 0 50px rgba(var(--brgb),.35),0 0 24px rgba(var(--grgb),.25)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#070b16}
.ring b{position:relative;font:700 26px Sora,sans-serif}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);margin-bottom:10px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--gold),var(--blue));box-shadow:0 0 12px rgba(var(--grgb),.8)}
.float{position:absolute;z-index:3;padding:16px 20px;border-radius:22px;font-size:14px}
.float b{display:block;font:700 20px Sora,sans-serif;color:var(--gold)}
.f1{left:-24px;top:28px;animation:rvIn 1.1s var(--ease) 1.8s backwards,bob 7s ease-in-out 3s infinite reverse}
.f2{right:-12px;bottom:80px;animation:rvIn 1.1s var(--ease) 2s backwards,bob 9s ease-in-out 3.2s infinite}
.back{position:absolute;z-index:1;width:230px;height:380px;border-radius:40px;right:30px;top:24px;transform:rotate(8deg);opacity:.7}

section{padding:56px 0}
.head{margin-bottom:32px}.head h2{font-size:clamp(28px,4vw,44px)}
.head p{color:var(--muted);margin:8px 0 0;max-width:52ch}
.rv:not(.in):not(.in0){opacity:0}
.rv.in{animation:rvIn .95s var(--ease) backwards;animation-delay:calc(var(--i,0)*80ms)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filters button{font:600 14px Manrope,sans-serif;color:var(--muted);padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;transition:transform .4s var(--ease),background .35s,color .35s,box-shadow .35s}
.filters button:hover{color:var(--text);transform:translateY(-1px)}.filters button:active{transform:scale(.95)}
.filters button[aria-pressed=true]{background:linear-gradient(135deg,#fbefc0,var(--gold));color:var(--on-gold);border-color:transparent;box-shadow:0 8px 24px -8px rgba(var(--grgb),.7)}
.pieces{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.piece{padding:26px;display:flex;flex-direction:column;gap:10px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .45s var(--ease),box-shadow .45s}
.piece:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 34px 70px -22px rgba(0,0,0,.95),0 0 40px -10px rgba(var(--brgb),.4)}
.piece h3{font-size:20px}.piece p{margin:0;color:var(--muted);font-size:14.5px}
.piece .meta{font-size:13px;opacity:.8}
.piece .price{margin-top:auto;padding-top:8px;font:700 18px Sora,sans-serif;color:var(--gold)}
.ph{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;transition:transform .9s var(--ease)}
.piece:hover .ph{transform:scale(1.035)}
.tag{align-self:flex-start;padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;color:#a9c7ff;background:rgba(var(--brgb),.14);border:1px solid rgba(var(--brgb),.38)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.about .glass{padding:32px}.about h3{font-size:22px;margin-bottom:10px}.about p{margin:0;color:var(--muted)}
.contact{text-align:center;padding:64px 24px;margin:40px 0 24px}
.contact h2{font-size:clamp(30px,5vw,54px);max-width:16ch;margin:0 auto 16px}
.contact p{color:var(--muted);margin:0 auto 28px;max-width:44ch}
.facts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.facts span,.facts a{padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:14px}
.facts a{transition:background .3s,transform .4s var(--ease)}.facts a:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
footer{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:13px;padding:8px 0 44px}
.flogo{height:30px;width:auto;opacity:.9}
.lnk{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.note{color:var(--muted);font-size:13px;margin:0}
.pill{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--on-gold);background:linear-gradient(135deg,#fbefc0,var(--gold))}

/* admin */
.adm{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;justify-content:flex-end;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.pane{width:min(480px,100%);height:100%;border-radius:28px 0 0 28px;padding:20px;overflow:auto;background:rgba(9,13,24,.9);display:flex;flex-direction:column;gap:14px}
.pane.enter{animation:slide .55s var(--ease)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.pane.gate{margin:auto;height:auto;width:min(380px,92%);border-radius:28px;animation:rvIn .6s var(--ease)}
.adm label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.adm input,.adm textarea,.adm select{font:inherit;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.adm textarea{min-height:96px;resize:vertical}.adm option{background:#0b1020}
.adm .filters{margin:0}.adm .btn{font:600 14px Manrope,sans-serif;padding:10px 18px}
.adm .btn.warn{border-color:#ff8a8a;color:#ff8a8a}
.adm .chk{display:flex;align-items:center;gap:8px;color:var(--text)}.adm .chk input{width:auto}
.adm input[type=color]{height:44px;padding:4px}
.pc{border:1px solid var(--line);border-radius:16px;padding:10px 14px}.pc summary{cursor:pointer;font-weight:600}
.pc .in{display:grid;gap:10px;margin-top:12px}
.rowf{display:flex;gap:8px;align-items:center}.rowf .btn{flex:none}
.err{color:#ff8a8a;min-height:1.2em;margin:0;font-size:13px}.err.ok{color:var(--gold)}

@media(max-width:860px){
 .hero{grid-template-columns:1fr;padding-top:40px}.stage{height:580px}
 .pieces{grid-template-columns:1fr}.about{grid-template-columns:1fr}
 nav ul li:not(:last-child){display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1!important}.splash{display:none}html{scroll-behavior:auto}}

.pane>*{flex:none}
.bar{position:sticky;bottom:-20px;margin:0 -20px -20px;padding:14px 20px 20px;display:grid;gap:10px;background:linear-gradient(to top,rgba(9,13,24,.98) 70%,rgba(9,13,24,0));z-index:2}
.bar .btns{gap:10px}
.adm .btn.main{color:var(--on-gold)}

.price small,.facts small{display:block;font:500 12.5px Manrope,sans-serif;color:var(--muted);margin-top:2px}
.ratenote{text-align:center;margin-top:20px}
.facts span{text-align:center}

.navr{display:flex;align-items:center;gap:8px}
.cartbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:999px;border:1px solid rgba(var(--grgb),.5);background:rgba(var(--grgb),.12);color:var(--text);font:600 14px Manrope,sans-serif;cursor:pointer;transition:transform .4s var(--ease),background .3s}
.cartbtn:hover{transform:translateY(-1px);background:rgba(var(--grgb),.2)}
.cartbtn i{font-style:normal;min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:linear-gradient(135deg,#fbefc0,var(--gold));color:var(--on-gold);font-size:13px}
.cartbtn.pulse{animation:pulse .6s var(--ease)}
@keyframes pulse{40%{transform:scale(1.12)}}
.piece .add{margin-top:10px;padding:11px 18px;font-size:14px;text-align:center}
.piece .add[disabled]{opacity:.5;cursor:not-allowed}
.piece .add:not([disabled]){border-color:rgba(var(--grgb),.5)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:90;padding:12px 18px;border-radius:99px;display:flex;gap:12px;align-items:center;font-size:14px;animation:rvIn .5s var(--ease)}
.toast .lnk{color:var(--gold);font-weight:600}
.cartpane .line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cartpane .lt{display:grid;gap:2px}.cartpane .lt span{color:var(--muted);font-size:13px}
.cartpane .qty{display:flex;align-items:center;gap:8px}.cartpane .qty .btn{padding:4px 12px}
.cartpane .line .lnk{justify-self:start;font-size:13px}
.cartpane .tot{grid-template-columns:auto 1fr;border:0}.cartpane .tot span{text-align:right;color:var(--gold);font-weight:600}
.cartpane .btn.main,.cartpane a.btn{text-align:center}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
@media(max-width:560px){nav ul{display:none}}
</style>
</head>

 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('That file could not be read as an image.'))};
 im.onload=()=>{URL.revokeObjectURL(u);const w0=im.naturalWidth||600,h0=im.naturalHeight||600,s=Math.min(1,640/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/png');
  if(d.length>3*1048576)return no(new Error('That logo is too detailed. Try a simpler or smaller file.'));ok(d)};
 im.src=u});
async function importJSON(f){try{if(f.size>20*1048576)throw 0;const o=JSON.parse(await f.text());
 if(o&&!o.pieces&&Array.isArray(o.collections))o.pieces=o.collections.map(x=>({n:x.name,c:x.category,cu:x.cultural,m:x.material,usd:x.price,s:x.story,img:''}));

async function exportJSON(){const o=JSON.parse(JSON.stringify(D));delete o.pw;const data=JSON.stringify(o,null,1),name='oba-by-kele-backup-'+new Date().toISOString().slice(0,10)+'.json';

  if(dl){await dl.save({filename:name,data});say('Backup ready.',1)}

 }catch(e){say(e&&e.code==='declined'?'Download cancelled.':'Could not create the backup file.')}}
async function fetchRate(){say('Fetching today’s rate…',1);const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
 try{const r=await fetch('https://open.er-api.com/v6/latest/USD',{signal:ac.signal});if(!r.ok)throw 0;const j=await r.json(),n=j&&j.rates&&j.rates.NGN;if(!(n>0))throw 0;
  D.money.rate=String(Math.round(n*100)/100);D.money.date=today();mark();render();panel(true);say('Rate updated to ₦'+D.money.rate+' per $1.',1)}

function reset(){if(arm){clearTimeout(arm.t);arm.b.textContent=arm.o;arm.b.classList.remove('warn');arm=null}}
function twice(b,fn){if(arm&&arm.b===b){clearTimeout(arm.t);arm=null;return fn()}reset();const o=b.textContent;b.textContent='Tap again to confirm';b.classList.add('warn');arm={b,o,t:setTimeout(reset,3000)}}
function check(){const e=[],c=D.contact;
 if(!D.pw)e.push('Set an admin password in the Backup tab first.');
 if(c.wa&&!/^\d{8,15}$/.test(c.wa.replace(/\D/g,'')))e.push('WhatsApp number needs 8 to 15 digits including the country code.');
 if(c.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email))e.push('The email address looks invalid.');
 if(c.ig&&!/^@?[\w.]{1,30}$/.test(c.ig.trim()))e.push('Instagram handles can only use letters, numbers, dots and underscores.');
 D.pieces.forEach((p,i)=>{if(!p.n.trim())e.push('Piece '+(i+1)+' needs a name.');if(p.usd.trim()!==''&&!/^[\s$]*\d[\d,]*(\.\d{1,2})?\s*$/.test(p.usd))e.push('Piece '+(i+1)+': the price must be a number in dollars.')});
 if(D.shop.endpoint.trim()&&!/^https:\/\//.test(D.shop.endpoint.trim()))e.push('The form service address must start with https://');
 if(D.money.naira&&D.money.rate.trim()!==''&&!(num(D.money.rate)>0))e.push('The exchange rate must be a number above 0 (Prices tab).');
 D.cats.forEach((x,i)=>{if(!x.label.trim())e.push('Filter '+(i+1)+' needs a name.')});
 return e}
function buildHtml(){
 const c=document.documentElement.cloneNode(true);
 c.querySelectorAll('.adm').forEach(n=>n.remove());
 c.querySelector('#dirty').setAttribute('hidden','');c.querySelector('#toast').setAttribute('hidden','');c.querySelector('#cartBtn').setAttribute('hidden','');c.querySelector('#cartN').textContent='0';
 c.querySelectorAll('[data-t],#filters,#pieces,#facts,#cbtns,#feat,#cnt,#ratenote').forEach(n=>n.textContent='');
 c.querySelectorAll('#aimg,#logoimg,#splogo,#footlogo').forEach(n=>{n.removeAttribute('src');n.setAttribute('hidden','')});
 c.querySelectorAll('.rv').forEach(n=>n.classList.remove('in','in0'));
 c.querySelectorAll('.glass').forEach(n=>{['--mx','--my','--rx','--ry'].forEach(p=>n.style.removeProperty(p));if(!n.getAttribute('style'))n.removeAttribute('style')});
 c.querySelector('nav').classList.remove('scrolled');
 c.querySelector('#state').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 c.querySelector('title').textContent=D.txt.title||'Portfolio';
 const html='<!DOCTYPE html>\n'+c.outerHTML;
 if(html.length>15.5*1048576){say('The page is too large. Remove some photos.');return null}
 return html}
function guard(){const e=check();if(e.length){say(e[0]+(e.length>1?' ('+(e.length-1)+' more)':''));return false}return true}
const getArt=()=>window.claude&&claude.use?claude.use('artifact'):Promise.resolve(null);
async function pubClaude(art){
 if(!guard())return;const html=buildHtml();if(!html)return;say('Publishing…',1);
 try{persist();await art.publish(html);dirty=false;clearDraft();say('Published.',1)}
 catch(e){const m={conflict:'A newer version was published first. Your edits are kept on this device. Reload and they will come back.',not_writer:'This view is read-only. Sign in to Claude as the page owner to publish here.',not_granted:'This view is read-only. Sign in to Claude as the page owner to publish here.',rate_limited:'Publishing too often. Wait a minute, then try again.',upstream_error:'Claude had a problem saving. Try again in a moment.'};say(m[e&&e.code]||'Could not publish. Check your connection and try again.')}}
async function saveAll(){
 if(!guard())return;const ok=persist(),art=await getArt();
 if(art)return pubClaude(art);
 say(ok?'Saved on this device. To update the live site for visitors, open the Publish tab.':'This browser could not store your edits. Open the Publish tab and download your website file.',ok)}
async function dlSite(){
 if(!guard())return;const html=buildHtml();if(!html)return;persist();
 try{const dl=await(window.claude&&claude.use?claude.use('downloads'):null);
  if(dl){await dl.save({filename:'index.html',data:html})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.append(a);a.click();a.remove()}
  say('Website file ready. Upload it to your host to go live.',1)
 }catch(e){say(e&&e.code==='declined'?'Download cancelled.':'Could not create the file.')}}
const b64=s=>{const u=new TextEncoder().encode(s);let r='';for(let i=0;i<u.length;i+=32768)r+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(r)};
async function ghPublish(){
 if(!guard())return;const d=D.deploy,tok=($('#ghtok').value||'').trim();
 if(!/^[\w.-]+\/[\w.-]+$/.test(d.repo.trim()))return say('Repository must look like owner/name.');
 if(!d.path.trim()||/^\/|\.\./.test(d.path.trim()))return say('Enter the file path inside the repository, for example index.html.');
 if(!d.branch.trim())return say('Enter the branch name, for example main.');
 if(!tok)return say('Paste your GitHub token first.');
 const html=buildHtml();if(!html)return;persist();
 const api='https://api.github.com/repos/'+d.repo.trim()+'/contents/'+d.path.trim().split('/').map(encodeURIComponent).join('/'),
  H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 say('Publishing to GitHub…',1);
 try{let sha;const q=await fetch(api+'?ref='+encodeURIComponent(d.branch.trim()),{headers:H});
  if(q.status===200)sha=(await q.json()).sha;else if(q.status!==404)throw{status:q.status};
  const body={message:'Update portfolio from admin panel',content:b64(html),branch:d.branch.trim()};if(sha)body.sha=sha;
  const p=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!p.ok)throw{status:p.status};
  dirty=false;clearDraft();$('#ghtok').value='';say('Published to GitHub. Your host updates in a minute or two.',1)
 }catch(e){const m={401:'GitHub rejected the token. Check it and try again.',403:'The token does not have permission. It needs Contents: Read and write on this repository.',404:'Repository, branch or file path not found, or the token cannot see it.',409:'GitHub reported a conflict. Try again.',422:'GitHub refused the update. Check the branch and file path.'};
  say(e&&e.status?(m[e.status]||'GitHub returned an error ('+e.status+').'):'Could not reach GitHub. This works on your own site, not inside Claude’s preview.')}}
adm.addEventListener('change',async e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
 if('import' in t.dataset){t.value='';return importJSON(f)}
 if(t.dataset.img==null)return;
 try{const k=t.dataset.img,u=await(k==='logo'?shrinkLogo(f):shrink(f));if(k==='logo')D.logo=u;else if(k==='about')D.about.img=u;else D.pieces[+k].img=u;mark();render();panel(true);say(k==='logo'?'Logo added.':'Photo added.',1)}
 catch(er){t.value='';say(er.message)}});

 if(e.target===adm)return closeAdm();

 else if(a==='up'||a==='down'){const j=a==='up'?i-1:i+1;if(j<0||j>=n)return;[D.pieces[i],D.pieces[j]]=[D.pieces[j],D.pieces[i]];[...opened].forEach(k=>/^p\d/.test(k)&&opened.delete(k));opened.add('p'+j);ch()}

 else if(a==='fetchrate')fetchRate();
 else if(a==='testmail'){say('Sending a test email…',1);postForm({subject:'Test from your portfolio admin',from_name:'ỌBA BY KELE site',message:'If you can read this, order emails and visit alerts are working.'}).then(()=>say('Test sent. Check your inbox and spam folder.',1)).catch(e=>say(mailErr(e)))}
 else if(a==='rmimg'){D.pieces[i].img='';ch()}
 else if(a==='rmabout'){D.about.img='';ch()}
 else if(a==='cadd'){D.cats.push({id:'c'+Date.now().toString(36),label:'New filter'});ch()}

  try{D.pw=await sha(v);mark();say('Password updated. Press Save to keep it.',1)}catch(x){say('This browser blocks password checks on this page.')}}

});
